name: LogRhythm.Tools CI

on:
  push:
    branches:
      - main
      - development
      - v1.5.0-update
  pull_request:
    branches:
      - main
      - development

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pester 5.x
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser

      - name: Import module
        shell: pwsh
        run: |
          Import-Module ./src/LogRhythm.Tools.psm1 -Force

      - name: Run module validation
        shell: pwsh
        run: |
          .\tests\Test-ModuleValidation.ps1

  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pester 5.x
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser

      - name: Run Pester unit tests
        shell: pwsh
        run: |
          .\tests\Run-Tests.ps1 -Tag Unit -OutputFile ./test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ./test-results.xml

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results (${{ matrix.os }})
          path: ./test-results.xml
          reporter: java-junit
          fail-on-error: false
